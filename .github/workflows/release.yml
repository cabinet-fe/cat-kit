name: 发布到 npm

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 校验发布分支
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "手动发布仅允许从 main 触发，当前 ref: ${{ github.ref }}"
            exit 1
          fi

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js（供 npm publish 使用）
        # 注意：不要设置 registry-url！它会写入含占位 NODE_AUTH_TOKEN 的 .npmrc，
        # npm 会优先使用该 token 而跳过 OIDC 交换，导致 E404 假报错（npm/cli#8730）
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 安装 npm@11
        # 固定 11.x：trusted publishing 需要 >= 11.5.1；但 npm 12 改了 `npm info --json`
        # 输出结构（object -> list），changesets 2.31 解析不了会误判所有包"未发布"
        run: npm install -g npm@11

      - name: 缓存 Bun 依赖
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行测试
        run: bun run test

      - name: 构建所有包
        run: bun run build:packages

      - name: 规范化 workspace 依赖（供 npm publish 使用）
        run: bun run scripts/normalize-workspace-dependencies.ts

      - name: 发布到 npm 并准备 GitHub Release
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run changeset publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm 已配置 GitHub Actions 为可信 CI（OIDC），无需 NPM_TOKEN
          # 覆盖项目 .npmrc 的镜像源，确保发布到 npm 官方 registry
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_PROVENANCE: 'true'

      - name: 创建聚合 GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: bun run scripts/create-github-releases.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          CHANGESETS_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
